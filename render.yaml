services:
  - type: web
    name: nexus-dome-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT smartnest.asgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: USE_REDIS
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-dome-db
          property: connectionString

databases:
  - name: nexus-dome-db
    region: oregon
    plan: free
